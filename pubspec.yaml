name: chess_coach
description: Personal offline chess coach for Android, Windows and Ubuntu.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  chessground: ^10.3.0
  dartchess: ^0.14.0
  fluent_ui: ^4.16.1
  shared_preferences: ^2.5.6
  multistockfish: ^0.6.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2B5BD7"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
