name: chess_coach
description: Personal offline chess coach for Android, Windows and Ubuntu.
publish_to: none
version: 0.9.2+12

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  chessground: ^10.3.0
  dartchess: ^0.14.0
  fluent_ui: ^4.16.1
  shared_preferences: ^2.5.6
  multistockfish: ^0.6.1
  path_provider: ^2.1.6
  llamadart: 0.11.1
  crypto: ^3.0.6
  url_launcher: 6.3.2
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

# llamadart runs the optional explainer model. Bundle only its llama.cpp runtime, CPU backend.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          linux: [cpu]
          windows: [cpu]
          android: [cpu]

flutter:
  uses-material-design: true
  assets:
    - assets/maia/
    - assets/puzzles/

flutter_launcher_icons:
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_bg.png
  adaptive_icon_foreground: assets/icon/icon_fg.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
