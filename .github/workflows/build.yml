name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push replaces an older run instead of piling up.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: only the release job may write (it publishes the GitHub Release).
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  # Every build stores this as the file date, so artifacts are reproducible
  # (dpkg-deb, mksquashfs and the tar/zip steps below all honor it).
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  check:
    name: Analyze, test, screenshots
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/fetch_engines.sh linux
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Render screenshots
        run: flutter test screenshots/screenshots_test.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/out

  linux:
    name: Linux build
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/fetch_engines.sh linux
      - name: Google sign-in client for sync (empty until the secrets exist)
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ANDROID_SERVER_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_SERVER_CLIENT_ID }}
        run: |
          mkdir -p build
          printf '{"GOOGLE_OAUTH_CLIENT_ID":"%s","GOOGLE_OAUTH_CLIENT_SECRET":"%s","GOOGLE_ANDROID_SERVER_CLIENT_ID":"%s"}' \
            "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" "$GOOGLE_ANDROID_SERVER_CLIENT_ID" > build/oauth.json
      - run: flutter build linux --release --dart-define-from-file=build/oauth.json --obfuscate --split-debug-info=build/debug-info
      - name: Check the downloaded llama.cpp runtime
        run: dart run tool/check_native_bundles.dart linux-x64
      - run: bash packaging/linux/build_appimage.sh ${{ needs.check.outputs.version }}
      - run: bash packaging/linux/build_deb.sh ${{ needs.check.outputs.version }}
      - name: Bundle (normalized timestamps for reproducible builds)
        run: |
          GZIP=-n tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf build/ChessCoach-${{ needs.check.outputs.version }}-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            build/ChessCoach-*.AppImage
            build/ChessCoach-*-amd64.deb
            build/ChessCoach-*-linux-x64.tar.gz

  android:
    name: Android APK
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # A release must never ship with the debug key (it could not update over earlier versions).
          if [ -z "$KEYSTORE_BASE64" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::The Android release signing key secret is missing."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Google sign-in client for sync (empty until the secrets exist)
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ANDROID_SERVER_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_SERVER_CLIENT_ID }}
        run: |
          mkdir -p build
          printf '{"GOOGLE_OAUTH_CLIENT_ID":"%s","GOOGLE_OAUTH_CLIENT_SECRET":"%s","GOOGLE_ANDROID_SERVER_CLIENT_ID":"%s"}' \
            "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" "$GOOGLE_ANDROID_SERVER_CLIENT_ID" > build/oauth.json
      - run: flutter build apk --release --split-per-abi --dart-define-from-file=build/oauth.json --obfuscate --split-debug-info=build/debug-info
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Check the downloaded llama.cpp runtime
        run: dart run tool/check_native_bundles.dart android-arm64
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/ChessCoach-${{ needs.check.outputs.version }}-android-arm64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: build/ChessCoach-*-android-arm64.apk

  windows:
    name: Windows build
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/fetch_engines.sh windows
        shell: bash
      - name: Google sign-in client for sync (empty until the secrets exist)
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ANDROID_SERVER_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_SERVER_CLIENT_ID }}
        run: |
          mkdir -p build
          printf '{"GOOGLE_OAUTH_CLIENT_ID":"%s","GOOGLE_OAUTH_CLIENT_SECRET":"%s","GOOGLE_ANDROID_SERVER_CLIENT_ID":"%s"}' \
            "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" "$GOOGLE_ANDROID_SERVER_CLIENT_ID" > build/oauth.json
      - run: flutter build windows --release --dart-define-from-file=build/oauth.json --obfuscate --split-debug-info=build/debug-info
      - name: Check the downloaded llama.cpp runtime
        shell: bash
        run: dart run tool/check_native_bundles.dart windows-x64
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Installer and zip
        shell: pwsh
        run: |
          $v = '${{ needs.check.outputs.version }}'
          # Fixed file dates (SOURCE_DATE_EPOCH), so the installer and zip are
          # reproducible; TimeStampsInUTC in installer.iss keeps timezones out.
          $stamp = [DateTime]::UnixEpoch.AddSeconds([long]$env:SOURCE_DATE_EPOCH)
          Get-ChildItem -Recurse build\windows\x64\runner\Release | ForEach-Object { $_.LastWriteTime = $stamp }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$v" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "build\installer\ChessCoach-$v-Setup.exe" build\
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "build\ChessCoach-$v-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/ChessCoach-*-Setup.exe
            build/ChessCoach-*-windows-x64.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, linux, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '{linux,android,windows}'
          merge-multiple: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Checksums, SBOM and release signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # A release must never go out unsigned: the app refuses to auto-install it.
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The release signing key secret (RELEASE_SIGNING_KEY) is missing."
            exit 1
          fi
          # Checksums, so anyone can confirm a download is exactly what CI built.
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          # The signature the app's updater requires (see lib/app/release_key.dart).
          dart run tool/sign_release.dart sign dist/SHA256SUMS.txt
          # The dependency inventory for vulnerability tracking.
          dart run tool/sbom.dart > dist/SBOM.cdx.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" dist/* --title "Chess Coach ${GITHUB_REF_NAME#v}" --notes-file "$notes"

  verify:
    name: Rebuild Linux and compare (reproducible builds)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/fetch_engines.sh linux
      - name: Google sign-in client for sync (must match the release build)
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ANDROID_SERVER_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_SERVER_CLIENT_ID }}
        run: |
          mkdir -p build
          printf '{"GOOGLE_OAUTH_CLIENT_ID":"%s","GOOGLE_OAUTH_CLIENT_SECRET":"%s","GOOGLE_ANDROID_SERVER_CLIENT_ID":"%s"}' \
            "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" "$GOOGLE_ANDROID_SERVER_CLIENT_ID" > build/oauth.json
      - run: flutter build linux --release --dart-define-from-file=build/oauth.json --obfuscate --split-debug-info=build/debug-info
      - name: Check the downloaded llama.cpp runtime
        run: dart run tool/check_native_bundles.dart linux-x64
      - run: bash packaging/linux/build_appimage.sh ${{ needs.check.outputs.version }}
      - run: bash packaging/linux/build_deb.sh ${{ needs.check.outputs.version }}
      - name: Bundle (normalized timestamps for reproducible builds)
        run: |
          GZIP=-n tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf build/ChessCoach-${{ needs.check.outputs.version }}-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
      - name: Compare with the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --output /tmp/published-sums.txt
          (cd build && sha256sum ChessCoach-$v-x86_64.AppImage ChessCoach-$v-amd64.deb ChessCoach-$v-linux-x64.tar.gz > /tmp/rebuild-sums.txt)
          # Fail loudly on any mismatch: the release was then not reproducible.
          for f in ChessCoach-$v-x86_64.AppImage ChessCoach-$v-amd64.deb ChessCoach-$v-linux-x64.tar.gz; do
            want="$(grep -F "  $f" /tmp/published-sums.txt | cut -d' ' -f1)"
            got="$(grep -F "  $f" /tmp/rebuild-sums.txt | cut -d' ' -f1)"
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::$f is not reproducible: release=${want:-missing}, rebuild=${got:-missing}"
              exit 1
            fi
            echo "OK $f $got"
          done

  security-scan:
    name: Dependency scan (OSV)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # Report every finding to Code Scanning instead of failing the build on
      # the first low-severity hit; the maintainer reviews the Security tab.
      fail-on-vuln: false
      upload-sarif: true
